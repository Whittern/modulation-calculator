name: Build Flet APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools
        run: pip install flet cython

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build
        run: |
          mkdir -p src
          cp main.py src/main.py
          yes | flet build apk src

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: music-app-apk
          path: build/apk/app-release.apk
